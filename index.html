<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BACKROOMS: CREATE & ESCAPE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#eee;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;background:#111}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{pointer-events:auto;background:rgba(8,8,8,.84);border:1px solid #555;border-radius:14px;padding:14px;backdrop-filter:blur(8px)}
#top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
button{border:1px solid #777;background:#1b1b1b;color:#fff;border-radius:10px;padding:10px 13px;font-size:14px}
button:active{transform:scale(.97);background:#333}
#mode{font-weight:800;letter-spacing:.08em}
#stats{position:absolute;top:67px;left:10px;background:#000a;padding:8px 10px;border-radius:9px;font-size:13px;display:none}
#creator{position:absolute;left:10px;right:10px;bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:7px}.small{font-size:12px;color:#bbb}
#title{font-size:20px;font-weight:800;margin-bottom:5px}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#25251f,#050505)}
#menu .panel{width:min(92vw,430px);text-align:center}h1{margin:0 0 8px;font-size:29px}
#mobile{position:absolute;inset:0;pointer-events:none}
#stick{position:absolute;left:18px;bottom:92px;width:120px;height:120px;border:2px solid #888;border-radius:50%;background:#fff1;pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:46px;height:46px;border-radius:50%;background:#fff5}
#look{position:absolute;right:0;top:0;width:65%;height:72%;pointer-events:auto}
#action{position:absolute;right:20px;bottom:105px;pointer-events:auto;border-radius:50%;width:68px;height:68px;font-weight:800}
#msg{position:absolute;left:50%;top:82px;transform:translateX(-50%);background:#000d;padding:9px 13px;border-radius:9px;display:none;white-space:nowrap}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#fff8;display:none}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000b}
#result .panel{width:min(90vw,390px);text-align:center}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="menu"><div class="panel">
    <h1>BACKROOMS</h1>
    <div class="small" style="margin-bottom:18px">CREATE & ESCAPE</div>
    <button id="playBtn" style="width:100%;margin-bottom:8px">▶ PLAY</button>
    <button id="createBtn" style="width:100%">＋ CREATE</button>
    <div class="small" style="margin-top:14px">鍵を集めて出口へ。Entityに捕まるな。</div>
  </div></div>

  <div id="top" class="hidden">
    <div class="panel" id="mode">PLAY</div>
    <div class="row"><button id="saveBtn">SAVE</button><button id="menuBtn">MENU</button></div>
  </div>
  <div id="stats"></div>

  <div id="creator" class="panel hidden">
    <div id="title">Level Creator</div>
    <div class="small">パーツを選んでマップをタップ。ドラッグで移動できます。</div>
    <div class="row" style="margin-top:9px">
      <button data-tool="wall">🧱 壁</button>
      <button data-tool="floor">▰ 床</button>
      <button data-tool="light">💡 照明</button>
      <button data-tool="door">🚪 出口</button>
      <button data-tool="entity">👤 Entity</button>
      <button data-tool="key">🔑 鍵</button>
      <button data-tool="start">🟢 START</button>
      <button id="testBtn">▶ TEST</button>
      <button id="clearBtn">CLEAR</button>
    </div>
  </div>

  <div id="mobile" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <div id="look"></div>
    <button id="action">USE</button>
    <div id="cross">＋</div>
  </div>
  <div id="msg"></div>

  <div id="result" class="hidden"><div class="panel">
    <div id="resultTitle" style="font-size:30px;font-weight:900"></div>
    <div id="resultText" class="small" style="margin:10px 0 18px"></div>
    <button id="retryBtn" style="width:100%;margin-bottom:8px">もう一度</button>
    <button id="resultMenuBtn" style="width:100%">MENU</button>
  </div></div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,dpr,mode='menu',tool='wall',objects=[],player={x:0,y:0,a:0},keys=0;
let gameStart=0,gameOver=false,entityTimer=0,lastTime=0;
const WORLD={w:860,h:600};
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);
function show(id,on){document.getElementById(id).classList.toggle('hidden',!on)}
function msg(t){let e=document.getElementById('msg');e.textContent=t;e.style.display='block';clearTimeout(msg.tm);msg.tm=setTimeout(()=>e.style.display='none',1700)}
function defaultLevel(){return [
{x:70,y:60,w:720,h:18,t:'wall'},{x:70,y:520,w:720,h:18,t:'wall'},
{x:70,y:60,w:18,h:478,t:'wall'},{x:772,y:60,w:18,h:478,t:'wall'},
{x:300,y:60,w:18,h:180,t:'wall'},{x:520,y:260,w:18,h:278,t:'wall'},
{x:180,y:250,w:140,h:18,t:'wall'},{x:610,y:170,w:160,h:18,t:'wall'},
{x:140,y:120,w:26,h:26,t:'light'},{x:690,y:440,w:26,h:26,t:'light'},
{x:405,y:400,w:26,h:26,t:'light'},
{x:710,y:90,w:46,h:16,t:'door'},
{x:210,y:430,w:20,h:20,t:'key'},{x:670,y:330,w:20,h:20,t:'key'},{x:410,y:130,w:20,h:20,t:'key'},
{x:430,y:300,w:28,h:28,t:'entity'},
{x:105,y:100,w:22,h:22,t:'start'}]}
function save(){localStorage.setItem('br_level1',JSON.stringify(objects));msg('Levelを保存しました')}
function load(){try{objects=JSON.parse(localStorage.getItem('br_level1'))||defaultLevel()}catch{objects=defaultLevel()}}
function start(m){
 mode=m;gameOver=false;keys=0;entityTimer=0;
 show('menu',false);show('top',true);show('mobile',m==='play');show('creator',m==='create');show('result',false);
 document.getElementById('mode').textContent=m==='create'?'CREATE':'PLAY';
 document.getElementById('stats').style.display=m==='play'?'block':'none';
 document.getElementById('cross').style.display=m==='play'?'block':'none';
 if(m==='play'){load();let s=objects.find(o=>o.t==='start');player={x:s?s.x+11:100,y:s?s.y+11:100,a:0};gameStart=performance.now()}
}
document.getElementById('playBtn').onclick=()=>start('play');
document.getElementById('createBtn').onclick=()=>{objects=loadCreator();start('create')};
document.getElementById('menuBtn').onclick=goMenu;
function goMenu(){mode='menu';show('menu',true);show('top',false);show('mobile',false);show('creator',false);show('result',false)}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;msg('選択: '+tool)});
document.getElementById('clearBtn').onclick=()=>{objects=[];msg('Levelをクリア')};
document.getElementById('saveBtn').onclick=save;
document.getElementById('testBtn').onclick=()=>{save();start('play');msg('テストプレイ開始')};
function loadCreator(){try{return JSON.parse(localStorage.getItem('br_level1'))||defaultLevel()}catch{return defaultLevel()}}

canvas.addEventListener('pointerdown',e=>{
 if(mode!=='create')return;
 const r=canvas.getBoundingClientRect(),sx=(e.clientX-r.left)-(W/2-WORLD.w/2),sy=(e.clientY-r.top)-(H/2-WORLD.h/2);
 if(sx<0||sy<0||sx>WORLD.w||sy>WORLD.h)return;
 const size={wall:[80,16],floor:[70,50],light:[28,28],door:[48,18],entity:[28,28],key:[20,20],start:[22,22]}[tool]||[30,30];
 objects.push({x:sx-size[0]/2,y:sy-size[1]/2,w:size[0],h:size[1],t:tool});msg(tool+' を配置');
});

let joy={x:0,y:0},drag=false,lastX=0;
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
stick.addEventListener('pointerdown',e=>{drag=true;stick.setPointerCapture(e.pointerId);moveJoy(e)});
stick.addEventListener('pointermove',e=>{if(drag)moveJoy(e)});
stick.addEventListener('pointerup',()=>{drag=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'});
function moveJoy(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=38;if(len>max){dx=dx/len*max;dy=dy/len*max}joy={x:dx/max,y:dy/max};knob.style.transform=`translate(${dx}px,${dy}px)`}
const look=document.getElementById('look');
look.addEventListener('pointerdown',e=>{lastX=e.clientX});
look.addEventListener('pointermove',e=>{if(e.buttons&&mode==='play'){player.a+=(e.clientX-lastX)*.006;lastX=e.clientX}});
document.getElementById('action').onclick=useAction;

function rectHitCircle(o,x,y,r=10){let cx=Math.max(o.x,Math.min(x,o.x+o.w)),cy=Math.max(o.y,Math.min(y,o.y+o.h));return (x-cx)**2+(y-cy)**2<r*r}
function blocked(x,y){
 for(const o of objects)if(o.t==='wall'&&rectHitCircle(o,x,y,12))return true;
 return false;
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function useAction(){
 if(mode!=='play'||gameOver)return;
 const near=objects.find(o=>(o.t==='key'||o.t==='door')&&dist(player,{x:o.x+o.w/2,y:o.y+o.h/2})<45);
 if(near?.t==='key'){objects.splice(objects.indexOf(near),1);keys++;msg('🔑 鍵を手に入れた！');return}
 if(near?.t==='door'){
   const total=objects.filter(o=>o.t==='key').length+keys;
   if(keys>=total||keys>=3)win();
   else msg('🔒 鍵が足りない……');
   return
 }
 msg('何もない……');
}
function win(){gameOver=true;showResult('ESCAPED!','Backroomsから脱出した。時間: '+((performance.now()-gameStart)/1000).toFixed(1)+'秒')}
function lose(){gameOver=true;showResult('CAUGHT','Entityに捕まった……')}
function showResult(t,sub){document.getElementById('resultTitle').textContent=t;document.getElementById('resultText').textContent=sub;show('result',true)}
document.getElementById('retryBtn').onclick=()=>start('play');
document.getElementById('resultMenuBtn').onclick=goMenu;

function drawCreate(){
 ctx.fillStyle='#121212';ctx.fillRect(0,0,W,H);
 const ox=W/2-WORLD.w/2,oy=H/2-WORLD.h/2;
 ctx.save();ctx.translate(ox,oy);
 ctx.fillStyle='#8b8660';ctx.fillRect(0,0,WORLD.w,WORLD.h);
 ctx.strokeStyle='#77704e';ctx.lineWidth=1;
 for(let x=0;x<WORLD.w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD.h);ctx.stroke()}
 for(let y=0;y<WORLD.h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD.w,y);ctx.stroke()}
 for(const o of objects){
  if(o.t==='wall'){ctx.fillStyle='#343126';ctx.fillRect(o.x,o.y,o.w,o.h)}
  else if(o.t==='floor'){ctx.fillStyle='#69634a';ctx.fillRect(o.x,o.y,o.w,o.h)}
  else if(o.t==='light'){ctx.fillStyle='#fff3a0';ctx.fillRect(o.x,o.y,o.w,o.h)}
  else if(o.t==='door'){ctx.fillStyle='#70452d';ctx.fillRect(o.x,o.y,o.w,o.h)}
  else if(o.t==='entity'){ctx.fillStyle='#090909';ctx.beginPath();ctx.arc(o.x+o.w/2,o.y+o.h/2,o.w/2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f33';ctx.fillRect(o.x+6,o.y+8,4,4);ctx.fillRect(o.x+18,o.y+8,4,4)}
  else if(o.t==='key'){ctx.strokeStyle='#ffe06a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(o.x+7,o.y+8,6,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(o.x+12,o.y+13);ctx.lineTo(o.x+19,o.y+19);ctx.stroke()}
  else if(o.t==='start'){ctx.fillStyle='#36d477';ctx.beginPath();ctx.arc(o.x+11,o.y+11,10,0,Math.PI*2);ctx.fill()}
 }
 ctx.restore();
}
function drawWorld(){
 ctx.fillStyle='#b5ad7d';ctx.fillRect(0,0,W,H);
 const horizon=H*.46;
 ctx.fillStyle='#8a8460';ctx.fillRect(0,horizon,W,H-horizon);
 // perspective floor
 ctx.strokeStyle='#6f6a50';ctx.lineWidth=2;
 for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(W/2+i*18,horizon);ctx.lineTo(W/2+i*90,H);ctx.stroke()}
 for(let j=1;j<7;j++){let y=horizon+(H-horizon)*(j/7)**1.6;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // walls/ceiling impression
 ctx.fillStyle='#d1ca91';ctx.fillRect(0,horizon-90,W,90);
 ctx.fillStyle='#9b956f';for(let i=0;i<10;i++){let x=((i*173-player.a*100)%W+W)%W;ctx.fillRect(x,horizon-82,7,82)}
 // flickering lights
 const flick=Math.sin(performance.now()/180)>-.88;
 for(let i=0;i<5;i++){ctx.fillStyle=flick?'#fff7c4':'#665f40';ctx.fillRect((i+1)*W/6-35,30,70,8)}
 // nearby entity visual threat
 const ents=objects.filter(o=>o.t==='entity');
 if(ents.length&&entityTimer>2){
   const pulse=Math.max(0,1-Math.min(entityTimer/20,1));
   ctx.fillStyle=`rgba(120,0,0,${.10+.12*pulse})`;ctx.fillRect(0,0,W,H);
 }
}
function update(dt){
 if(mode!=='play'||gameOver)return;
 let speed=105*dt,dx=joy.x*speed,dy=joy.y*speed;
 const nx=player.x+dx,ny=player.y+dy;
 if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;
 // entity chases in the hidden top-down simulation
 entityTimer=(performance.now()-gameStart)/1000;
 const e=objects.find(o=>o.t==='entity');
 if(e){
   const ex=e.x+e.w/2,ey=e.y+e.h/2,d=Math.hypot(player.x-ex,player.y-ey);
   if(entityTimer>5&&d<280){
     const es=24*dt;e.x+=(player.x-ex)/Math.max(d,1)*es;e.y+=(player.y-ey)/Math.max(d,1)*es;
     if(d<22)lose();
   }
 }
 // auto-pickup keys when very close
 for(let i=objects.length-1;i>=0;i--){const o=objects[i];if(o.t==='key'&&dist(player,{x:o.x+o.w/2,y:o.y+o.h/2})<18){objects.splice(i,1);keys++;msg('🔑 鍵を入手 '+keys)}}
 const door=objects.find(o=>o.t==='door');const total=keys+objects.filter(o=>o.t==='key').length;
 if(door&&dist(player,{x:door.x+door.w/2,y:door.y+door.h/2})<25&&keys>=3)win();
 document.getElementById('stats').textContent=`🔑 ${keys}/3　⏱ ${entityTimer.toFixed(0)}s`;
}
function loop(t){
 const dt=Math.min((t-lastTime)/1000||0,.05);lastTime=t;
 update(dt);
 if(mode==='play')drawWorld();else if(mode==='create')drawCreate();else{ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H)}
 requestAnimationFrame(loop);
}
loop(0);
</script>
</body>
</html>
